<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0f0a1a">
<title>DashMtGMain</title>
<style>
:root {
  --bg: #0f0a1a;
  --panel: #1a1230;
  --panel2: #231a40;
  --line: #3a2c60;
  --text: #e6e0f4;
  --muted: #9488b6;
  --gold: #f2c14e;
  --gold-soft: #d9b45f;
  --today: #ff9a3c;
  --up: #6fd39a;
  --down: #ff5c6c;
  --warn: #ffb454;
}
* { box-sizing: border-box; }
a[href], button:not(:disabled) { cursor: pointer; }  /* ладошка на всём кликабельном */
html, body { margin: 0; height: 100%; }
body {
  display: flex; flex-direction: column; gap: 12px;
  padding: 14px 18px 16px;
  color: var(--text);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  background: radial-gradient(1100px 520px at 85% -8%, #35256455, transparent), var(--bg);
}

header { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
h1 .today { margin-left: 1.4em; }
h1 .hits { margin-left: 1.4em; color: var(--down); text-shadow: 0 0 18px #ff5c6c33; }
h1 .today .dt { font-size: 1.05em; font-family: "Times New Roman", Times, "Liberation Serif", serif; font-variant-numeric: lining-nums; letter-spacing: .08em; }
h1 {
  margin: 0; color: var(--gold);
  font: 700 1.3rem Georgia, "Times New Roman", serif;
  letter-spacing: .16em; text-transform: uppercase;
  text-shadow: 0 0 18px #f2c14e33;
}
.right { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 12px; }
button {
  cursor: pointer; padding: 5px 14px; border-radius: 999px;
  color: var(--gold); background: #f2c14e12; border: 1px solid #f2c14e66;
  font: 600 12px system-ui, sans-serif;
}
button:hover { background: #f2c14e24; }

main {
  flex: 1; min-height: 0; display: grid; gap: 12px;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1.5fr);
  grid-template-rows: repeat(12, minmax(0, 1fr));
}
/* первая колонка: Котировки (на 30% ниже прежних 6 строк), Аналитика — остальное, Следующие — по содержимому */
.col1 { grid-column: 1; grid-row: 1 / -1; min-height: 0; display: flex; flex-direction: column; gap: 12px; }
.col1 > .card[data-id="quotes"] { flex: 0 0 35%; }
.col1 > .card[data-id="analytics"] { flex: 1 1 0; }
.col1 > .card[data-id="next"] { flex: 0 1 auto; }
/* «Люди»: вся ширина второй колонки, по высоте содержимого; Платежи и Срочные заказы рядом */
.col2 { grid-column: 2; grid-row: 1 / -1; min-height: 0; display: flex; flex-direction: column; gap: 12px; }
.col2 > .card[data-id="people"] { flex: 0 1 auto; }
.col2 > .card[data-id="topdeck"] { flex: 0 1 auto; }
.col2 > .card[data-id="orders"] { flex: 1 1 0; }
.ocols { display: grid; gap: 8px; min-height: 0; grid-auto-rows: minmax(0, 1fr); height: 100%; }
.ocols .sub { min-height: 0; }
.ocols h3 { text-align: center; margin-bottom: 3px; }
.ocols .sub { padding: 5px 8px; }
.ocols ul { list-style: none; margin: 0; padding: 0; font: clamp(12.5px, .85vw, 16px)/1.4 ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; }
.ocols li { text-align: center; }
.ocols .none { color: var(--muted); text-align: center; }
.card[data-id="topdeck"] > .sub { flex: none; }
.mx { display: grid; gap: 6px 6px; align-items: center; }
.mx h3 { margin: 0; text-align: center; }
.mx .mk { color: var(--gold-soft); font: 700 clamp(.72rem, .74vw, .95rem) Georgia, "Times New Roman", serif; letter-spacing: .06em; text-transform: uppercase; line-height: 1.25; }
.mx .sb { display: block; text-align: center; text-decoration: none; padding: 5px 2px; border-radius: 8px; border: 1px solid;
  font: 700 clamp(12px, .85vw, 15px) system-ui, sans-serif; letter-spacing: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mx .shown { color: var(--gold); font-weight: 800; background: linear-gradient(180deg, #04b9d4, #177ad2); border-color: var(--gold); }
.mx .hidden { color: var(--gold); font-weight: 800; background: var(--down); border-color: var(--gold); }
/* чёрная обводка букв; давно не обновлённая тема — буквы красные */
.mx .shown, .mx .hidden { text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000, 0 0 2px #000; }
.mx .old { color: var(--down); }
.mx .split { display: flex; padding: 0; }
.mx .split .l { flex: 1; min-width: 0; padding: 5px 2px; overflow: hidden; text-overflow: ellipsis; }
.mx .split .r { flex: none; width: 2.2em; display: flex; align-items: center; justify-content: center; border-left: 1px solid var(--gold); }
.mx .r.can { background: linear-gradient(180deg, #ff7b88, #e0414f); color: #fff; }
.mx .r.wait { background: linear-gradient(180deg, #04b9d4, #177ad2); color: var(--gold); }
.mx .stub { color: var(--muted); border-color: var(--line); background: #ffffff08; }
.mx .error { color: var(--warn); border-color: #ffb45466; background: #ffb4540f; }
.card[data-id="people"] h2 .ico { margin-left: .45em; }
.card[data-id="people"] .sub h3 { white-space: nowrap; letter-spacing: .04em; font-size: clamp(.72rem, .74vw, .95rem); }
.card[data-id="people"] .pays .pn { white-space: normal; }  /* длинное имя переносится, а не обрезается */
.card[data-id="people"] > .subs { grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); grid-template-rows: auto; }

/* левый низ: «Следующие» (Сеты и Баны) под котировками, по высоте содержимого */
.card[data-id="next"] > .subs { grid-auto-rows: auto; }
/* «Сток» — вся третья колонка: сверху «Топ продаж», снизу «Запасы», в каждом две таблицы рядом */
.card[data-id="stock"] { grid-column: 3; grid-row: 1 / -1; }
.card[data-id="stock"] > .subs { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) minmax(0, 1fr); }
.sub[data-id="top"] > .subs, .sub[data-id="sales"] > .subs { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); }
.sub .sub .tbl .th { background: #2c2446; }

.card {
  display: flex; flex-direction: column; min-height: 0;
  padding: 12px 14px;
  background: linear-gradient(165deg, var(--panel2), var(--panel));
  border: 1px solid var(--line); border-radius: 14px;
  box-shadow: 0 6px 24px #0007;
}
h2, h3 {
  flex: none; margin: 0 0 8px; color: var(--gold);
  font: 700 clamp(.9rem, .95vw, 1.2rem) Georgia, "Times New Roman", serif;
  letter-spacing: .12em; text-transform: uppercase;
}
h2 .t, h2:not(.has-ico), h3 .t, h3:not(.has-ico) {
  text-decoration: underline; text-decoration-color: var(--gold);
  text-decoration-thickness: 1px; text-underline-offset: .28em;
}
h2.has-ico, h3.has-ico { display: flex; align-items: center; }
h2 { font-size: 1.3rem; }  /* заголовки карточек — как название даша */
h2 .bgap { flex: none; width: .8em; }
h2 .badge { font-size: 1em; text-transform: none; letter-spacing: .06em; color: var(--gold-soft); text-decoration: none; }
h2 .badge .bl { text-decoration: underline; text-decoration-color: var(--gold); text-decoration-thickness: 1px; text-underline-offset: .28em; }
h2 .badge .bv { color: var(--text); font-family: "Times New Roman", Times, "Liberation Serif", serif; font-variant-numeric: lining-nums; }
h2 .badge .bv.bad { color: var(--down); }
h2.has-ico .t, h3.has-ico .t { text-box: trim-both cap alphabetic; }
h2 .ico { flex: none; height: 1.6em; width: 1.6em; margin-left: .8em; }
h3 { font-size: clamp(.78rem, .8vw, 1rem); color: var(--gold-soft); margin-bottom: 6px; }
h3 .ico { flex: none; height: calc(1.6 * clamp(.9rem, .95vw, 1.2rem)); width: auto; margin: -.4em 0 -.4em .8em; }
h3.has-ico { margin-bottom: 14px; }
.body {
  flex: 1; min-height: 0; overflow: auto;
  scrollbar-width: thin; scrollbar-color: var(--line) transparent;
}
pre {
  margin: 0; white-space: pre-wrap; color: var(--text);
  font: clamp(12.5px, .8vw, 16px)/1.55 ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
}
pre .day, .d { color: var(--gold-soft); font-weight: 700; text-transform: uppercase; }
.d.now { color: var(--today); }
pre .note, pre .th, pre .cut { color: var(--muted); }
pre .cut { font-size: 11px; }

.card[data-id="quotes"] h2 { margin-bottom: 10px; }
.card[data-id="quotes"] h2 .ico { margin-left: .5em; transform: translateY(-.15em); }
.rng { margin-left: auto; display: flex; gap: 4px; }
.rng button { padding: 3px 11px; font-size: 11px; letter-spacing: .02em; text-transform: none; }
.rng button.on { background: #f2c14e2e; border-color: var(--gold); }
.rng button:disabled { cursor: default; opacity: .4; }
.card[data-id="quotes"] .body { display: flex; flex-direction: column; overflow-x: hidden; }
.quotes { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.qlist { display: grid; grid-template-columns: max-content max-content; justify-content: start; align-items: center; gap: 3px 8px; }
.qbtn { text-align: left; font: clamp(13.5px, .9vw, 17px)/1.5 ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; color: var(--text);
  padding: 3px 10px; border-radius: 8px; border: 1px solid transparent; background: transparent; cursor: pointer; }
.qbtn:hover:not(:disabled) { background: #f2c14e14; }
.qbtn.on { background: #f2c14e1f; border-color: #f2c14e66; }
.qbtn:disabled { cursor: default; opacity: .75; }
.qdelta { font: clamp(13.5px, .9vw, 17px)/1.5 ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
  padding: 3px 10px; border-radius: 8px; border: 1px solid #f2c14e44; background: #f2c14e0d; text-align: right; color: var(--muted); }
.qdelta.ok { color: var(--up); } .qdelta.mid { color: var(--warn); } .qdelta.bad { color: var(--down); }
.qchart { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.chart { flex: 1; min-height: 40px; display: flex; flex-direction: column; margin-top: 10px; font: clamp(12.5px, .8vw, 15px) system-ui, sans-serif; color: var(--muted); }
.chart .ctop { display: flex; align-items: baseline; gap: 6px; }
.chart .ct { color: var(--gold-soft); font-weight: 700; letter-spacing: .06em; margin-right: auto; }
.chart .cv { color: var(--text); font-weight: 600; }
.chart .ok { color: var(--up); } .chart .mid { color: var(--warn); } .chart .bad { color: var(--down); }
.chart .cbox { position: relative; flex: 1; min-height: 20px; margin: 6px 4px 4px; }
.chart svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.chart .cdot { position: absolute; width: 9px; height: 9px; margin: -4.5px 0 0 -4.5px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 10px 2px #f2c14e88; }
.chart .cends { display: flex; justify-content: space-between; gap: 8px; }
.chart .cr { color: #8d82ad; }

.icolink { display: inline-flex; line-height: 0; transition: transform .15s; }
.icolink:hover { transform: scale(1.12); }
.pays { display: grid; grid-template-columns: minmax(0, 1fr) max-content; gap: 2px 16px; align-items: baseline;
  font: clamp(13.5px, .9vw, 17px)/1.5 ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; }
.pays .pn { color: var(--text); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pays .pv { text-align: right; font-weight: 700; white-space: nowrap; }
.pays .pv.up { color: var(--up); } .pays .pv.down { color: var(--down); }
.pays .pd { grid-column: 1 / -1; color: var(--muted); font-size: .85em; line-height: 1.35; margin-bottom: 5px; padding-bottom: 5px; border-bottom: 1px solid var(--line); }
.cp { font: inherit; color: var(--gold-soft); background: #f2c14e0d; border: 1px solid #f2c14e66; border-radius: 6px;
  padding: 0 6px; cursor: pointer; text-align: left; letter-spacing: normal; text-transform: none; }
.cprow { flex: none; display: flex; gap: 8px; margin: 4px 0 8px; }
.cpbox { flex: none; margin-top: 8px; }
.cpbox .cprow { margin: 0; }
/* подпись над кнопками — как заголовок подкарточки, но мельче: между ним и текстом таблицы */
.cplbl { text-align: center; color: var(--gold-soft); font: 700 clamp(.76rem, .82vw, .98rem) Georgia, "Times New Roman", serif;
  letter-spacing: .12em; text-transform: uppercase; margin-bottom: 7px; }
.cplbl span { text-decoration: underline; text-decoration-color: var(--gold); text-decoration-thickness: 1px; text-underline-offset: .28em; }
/* кнопки выгрузки: текст в цвет своих строк, рамка у всех золотая */
.cp.z-bad { color: var(--down); background: #ff5c6c0f; border-color: #f2c14e66; }
.cp.z-mid { color: var(--warn); background: #ffb4540f; border-color: #f2c14e66; }
.cp.z-all { color: var(--text); background: #e6e0f40d; border-color: #f2c14e66; }
.cp.z-bad:hover { color: var(--down); background: #ff5c6c22; border-color: var(--gold); }
.cp.z-mid:hover { color: var(--warn); background: #ffb45422; border-color: var(--gold); }
.cp.z-all:hover { color: var(--text); background: #e6e0f41c; border-color: var(--gold); }
.cp.z-bad.ok { color: var(--bg); background: var(--down); }
.cp.z-mid.ok { color: var(--bg); background: var(--warn); }
.cp.z-all.ok { color: var(--bg); background: var(--text); }
.cpbox .cp { white-space: nowrap; letter-spacing: 0; padding: 4px 4px; font-size: clamp(11.5px, .78vw, 14px); }
.cprow .cp { flex: 1; text-align: center; padding: 4px 8px; font: 700 clamp(12.5px, .85vw, 15px) system-ui, sans-serif; letter-spacing: .04em; }
.cp:hover { color: var(--gold); background: #f2c14e1f; border-color: #f2c14e88; }
.cp.ok { color: var(--bg); background: var(--gold); border-color: var(--gold); }
.cp.err { color: var(--down); border-color: #ff5c6c66; }
.pays .pd:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }

.items { list-style: none; margin: 4px 0 0; padding: 0;
  font: clamp(13.5px, .9vw, 17px)/1.45 ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; }
.items li { padding: 6px 0; border-bottom: 1px solid var(--line); font-weight: 700; }
.items li:first-child { padding-top: 0; }
.items li:last-child { border-bottom: none; }

.card.login { grid-column: 2; grid-row: 4 / span 5; align-self: center; }
.login form { display: flex; flex-direction: column; gap: 10px; }
.login input[type=password] { font: 15px ui-monospace, Consolas, monospace; color: var(--text); background: #0f0a1a;
  border: 1px solid #f2c14e66; border-radius: 8px; padding: 8px 10px; outline: none; }
.login input[type=password]:focus { border-color: var(--gold); }
.login .rem { color: var(--muted); font-size: 13px; display: flex; align-items: center; gap: 6px; }
.login .rem input { accent-color: var(--gold); }
.login button { align-self: flex-start; padding: 6px 18px; }
.login .lmsg { min-height: 1.2em; color: var(--down); font-size: 13px; }

.tbl { display: grid; column-gap: 10px;
  font: clamp(12.5px, .85vw, 16px)/1.5 ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; }
.tbl > span { padding: 1px 0; border-bottom: 1px solid #3a2c6066; }
.tbl .tn { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tbl .tv { text-align: right; font-variant-numeric: tabular-nums; }
.tbl .th { position: sticky; top: 0; z-index: 1; background: #261d44; color: var(--gold-soft); font-size: .8em; letter-spacing: .06em; text-transform: uppercase; border-bottom-color: var(--line); }
.tbl .r1 { padding-top: 5px; }
.tbl .th { display: flex; align-items: flex-end; justify-content: flex-end; padding: 4px 0 4px; }
.tbl .th.tt { justify-content: flex-start; }
.tbl .th h3 { margin: 0; font-size: clamp(.78rem, .8vw, 1rem); letter-spacing: .12em; }
.tbl .ok { color: var(--up); } .tbl .mid { color: var(--warn); } .tbl .bad { color: var(--down); }

.warn {
  display: inline-block; margin-top: 6px; padding: 2px 9px; border-radius: 999px;
  color: var(--warn); background: #ffb45418; border: 1px solid #ffb45455; font-size: 11px;
}

.subs {
  flex: 1; min-height: 0; display: grid; gap: 10px;
  grid-template-columns: minmax(0, 1fr);
  grid-auto-rows: minmax(0, 1fr);
}
.sub {
  display: flex; flex-direction: column; min-height: 0; padding: 9px 11px;
  background: #ffffff08; border: 1px solid var(--line); border-radius: 10px;
}

/* низкий экран (ноутбук): плотнее отступы и чуть мельче шрифт, чтобы всё влезло без прокрутки */
@media (min-width: 1000px) and (max-height: 760px) {
  body { padding: 10px 16px 12px; gap: 8px; }
  main, .col1, .col2 { gap: 8px; }
  .items li { padding: 3px 0; }
  .card { padding: 8px 12px; }
  h2 { margin-bottom: 6px; font-size: 1.15rem; }
  .card[data-id="quotes"] h2 { margin-bottom: 8px; }
  .qbtn, .qdelta { font-size: 12.5px; padding: 1px 9px; }
  .qlist { gap: 2px 8px; }
  .chart { margin-top: 6px; font-size: 12px; }
  .sub { padding: 6px 10px; }
  h3, h3.has-ico { margin-bottom: 4px; }
  .pays { font-size: 12.5px; line-height: 1.35; }
  .pays .pd { margin-bottom: 3px; padding-bottom: 3px; }
  .tbl { font-size: 12px; line-height: 1.32; }
}

@media (max-width: 999px) {
  html, body { height: auto; }
  main { display: flex; flex-direction: column; }
  .card { grid-column: auto !important; grid-row: auto !important; }
  .col1, .col2 { display: contents; }
  .subs { display: flex; flex-direction: column; }
  .body { overflow: visible; }
  header { flex-wrap: wrap; }
}
</style>
</head>
<body>
<header>
  <h1>DashMtGMain<span class="today"><span class="big">Сегодня</span> <span class="dt" id="today"></span></span><span class="hits" id="hits"></span></h1>
  <div class="right"><span id="stamp"></span><button id="reload" type="button">↻ Обновить</button></div>
</header>
<main id="cards"></main>

<script>
// Страница ничего не запрашивает у сторонних сайтов: просто показывает data.json,
// который собирает collect.py по расписанию. Блоки и их порядок задаются в config.json.

const root = document.getElementById("cards");
const stamp = document.getElementById("stamp");
const reloadBtn = document.getElementById("reload");
const COL1 = ["quotes", "analytics", "next"];  // первая колонка
const COL2 = ["people", "topdeck", "orders"];  // вторая колонка: Люди и Topdeck по содержимому, Заказы — остальное
const LISTS = ["order"];  // блоки-списки: каждая строка отдельным пунктом

let TODAY = null; // {d, m, y} в часовом поясе дашборда
function setToday(tz) {
  const p = Object.fromEntries(new Intl.DateTimeFormat("en-GB", { timeZone: tz, day: "numeric", month: "numeric", year: "numeric" })
    .formatToParts(new Date()).map(x => [x.type, +x.value]));
  TODAY = { d: p.day, m: p.month, y: p.year };
  const z = n => String(n).padStart(2, "0");
  document.getElementById("today").textContent = z(p.day) + "." + z(p.month) + "." + z(p.year % 100);  // «Сегодня 31.10.26» в шапке
}
setToday("Europe/Moscow");

function fmt(iso, tz) {
  if (!iso) return "—";
  return new Date(iso).toLocaleString("ru-RU", {
    timeZone: tz, day: "numeric", month: "long", hour: "2-digit", minute: "2-digit",
  });
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

// Даты вида «ср, 28 октября», «3 ноября», «12 октября 2026»: золотым капсом, сегодняшняя — оранжевая
const MON = ["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
const DATE_RE = new RegExp("(?:(?:пн|вт|ср|чт|пт|сб|вс), )?(\\d{1,2}) (" + MON.join("|") + ")(?: (\\d{4}))?", "gi");
function isToday(m) {
  return TODAY && +m[1] === TODAY.d && MON.indexOf(m[2].toLowerCase()) + 1 === TODAY.m && (!m[3] || +m[3] === TODAY.y);
}
function dateNodes(text) {
  const out = [];
  let last = 0, m;
  DATE_RE.lastIndex = 0;
  while ((m = DATE_RE.exec(text))) {
    out.push(text.slice(last, m.index));
    out.push(el("span", isToday(m) ? "d now" : "d", m[0]));
    last = m.index + m[0].length;
  }
  out.push(text.slice(last));
  return out.filter(x => x !== "");
}

// Текст блока построчно; подсветка по виду строки, всё через textContent
function fillPre(pre, lines) {
  lines.forEach((line, i) => {
    if (i) pre.append("\n");
    let cls = "";
    if (/^---/.test(line)) cls = "cut";
    else if (/^#\s/.test(line)) cls = "th";
    else if (/^(время по |данные:)/.test(line)) cls = "note";
    if (cls) { pre.append(el("span", cls, line)); return; }
    pre.append(...dateNodes(line));
  });
}

function warnEl(item) {
  return el("span", "warn", "⚠ не обновилось: " + item.error + " — показаны прошлые данные");
}

// График курса: линия и заливка в SVG, подписи обычным текстом, чтобы не растягивались
let TZ = "Europe/Moscow";
function chartEl(ch) {
  // точки недельного графика с датой d, суточного — со временем t
  const pts = (ch.points || []).map(p => ({ t: p.t ? Date.parse(p.t) : Date.parse(p.d + "T00:00:00Z"), v: p.v, d: p.d }));
  if (pts.length < 2) return null;
  const NS = "http://www.w3.org/2000/svg";
  const t0 = pts[0].t, t1 = pts[pts.length - 1].t;
  const vs = pts.map(p => p.v), lo = Math.min(...vs), hi = Math.max(...vs);
  const pad = (hi - lo || hi * 0.01) * 0.18;
  const ymin = lo - pad, ymax = hi + pad;
  const X = p => (t1 === t0 ? 50 : ((p.t - t0) / (t1 - t0)) * 100);
  const Y = p => 100 - ((p.v - ymin) / (ymax - ymin)) * 100;
  const line = pts.map((p, i) => (i ? "L" : "M") + X(p).toFixed(2) + "," + Y(p).toFixed(2)).join("");
  const wrap = el("div", "chart");
  const top = el("div", "ctop");
  const last = pts[pts.length - 1], first = pts[0];
  const chg = (last.v / first.v - 1) * 100;
  const fv = v => v >= 1000 ? Math.round(v).toLocaleString("ru-RU") : v.toFixed(2).replace(".", ",");
  top.append(el("span", "ct", ch.title || ""),
    el("span", "cv", fv(last.v) + " " + (ch.cur || "₽") + " "),
    el("span", deltaZone(Math.abs(chg)), (chg >= 0 ? "+" : "−") + Math.abs(chg).toFixed(1).replace(".", ",") + "%"));
  const box = el("div", "cbox");
  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("viewBox", "0 0 100 100"); svg.setAttribute("preserveAspectRatio", "none");
  svg.innerHTML = '<defs><linearGradient id="cfill" x1="0" y1="0" x2="0" y2="1">' +
    '<stop offset="0" stop-color="#f2c14e" stop-opacity=".38"/><stop offset="1" stop-color="#f2c14e" stop-opacity="0"/></linearGradient></defs>' +
    '<path d="' + line + 'L100,100L0,100Z" fill="url(#cfill)"/>' +
    '<path d="' + line + '" fill="none" stroke="#f2c14e" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/>';
  box.append(svg);
  const dot = el("span", "cdot");
  dot.style.left = X(last) + "%"; dot.style.top = Y(last) + "%";
  box.append(dot);
  const ends = el("div", "cends");
  const lab = p => {
    if (!p.d) return new Date(p.t).toLocaleTimeString("ru-RU", { timeZone: TZ, hour: "2-digit", minute: "2-digit" });
    const [y, m, dd] = p.d.split("-"); return +dd + " " + MON[+m - 1].slice(0, 3);
  };
  ends.append(el("span", "", lab(first)), el("span", "cr", "мин " + fv(lo) + " · макс " + fv(hi)), el("span", "", lab(last)));
  wrap.append(top, box, ends);
  return wrap;
}

// Котировки кнопками: нажатие переключает график под ними; «неделя / сутки» — в заголовке карточки
let quoteSel = "USD", quoteRange = "day";  // по умолчанию открыты «Сутки»
// цвет изменения в % (рамки у пар и процент над графиком) по модулю: до 1% зелёный, до 2% жёлтый, дальше красный
const DELTA_ZONES = [1, 2];
const deltaZone = pc => pc <= DELTA_ZONES[0] ? "ok" : pc <= DELTA_ZONES[1] ? "mid" : "bad";
const RANGES = [["week", "Неделя"], ["day", "Сутки"]];
function quotesEl(c) {
  const wrap = el("div", "quotes");
  const codeOf = l => (l.match(/^[A-Z]{3}/) || [""])[0];
  const list = el("div", "qlist"), holder = el("div", "qchart");
  const rng = el("div", "rng");
  const set = code => {   // старый формат data.json: один недельный график без разбивки
    const x = c.charts[code];
    return x && x.points ? { week: x } : (x || {});
  };
  if (!c.charts[quoteSel]) quoteSel = Object.keys(c.charts)[0];
  const show = () => {
    holder.replaceChildren();
    const s = set(quoteSel);
    if (!s[quoteRange]) quoteRange = s.week ? "week" : "day";
    const ch = s[quoteRange] && chartEl(s[quoteRange]);
    if (ch) holder.append(ch);
    list.querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.code === quoteSel));
    list.querySelectorAll(".qdelta").forEach(x => {   // изменение курса в % за выбранный период: сутки или неделя
      const ch = set(x.dataset.code)[quoteRange], p = ch && ch.points;
      x.className = "qdelta";
      if (!p || p.length < 2) { x.textContent = "—"; return; }
      const d = (p[p.length - 1].v / p[0].v - 1) * 100, pc = Math.abs(d);
      x.textContent = (d > 0 ? "+" : d < 0 ? "−" : "") + pc.toFixed(2).replace(".", ",") + "%";
      x.classList.add(deltaZone(pc));
    });
    rng.querySelectorAll("button").forEach(b => {
      b.classList.toggle("on", b.dataset.r === quoteRange);
      b.disabled = !s[b.dataset.r];
    });
  };
  for (const [r, label] of RANGES) {
    const b = el("button", "", label); b.type = "button"; b.dataset.r = r;
    b.onclick = () => { quoteRange = r; show(); };
    rng.append(b);
  }
  for (const line of c.lines) {
    const code = codeOf(line);
    const b = el("button", "qbtn");
    b.dataset.code = code;
    b.type = "button";
    if (!c.charts[code]) b.disabled = true;
    const sp = el("span", "mono"); fillPre(sp, [line]); b.append(sp);
    b.onclick = () => { quoteSel = code; show(); };
    const dx = el("span", "qdelta"); dx.dataset.code = code;
    list.append(b, dx);
  }
  wrap.append(list, holder);
  wrap.rng = rng;
  show();
  return wrap;
}

function head(tag, item) {
  const h = el(tag);
  if (!ICONS[item.id]) { h.textContent = item.title; return h; }
  const im = el("img", "ico"); im.src = ICONS[item.id]; im.alt = "";
  h.className = "has-ico";
  h.append(el("span", "t", item.title));
  if (item.link) {  // иконка — ссылка (link в config.json)
    const a = el("a", "icolink"); a.href = item.link; a.target = "_blank"; a.rel = "noopener";
    a.append(im); h.append(a);
  } else h.append(im);
  if (item.badge && item.badge.value !== undefined) {  // «Продано: 71» справа от иконки, с тем же отступом
    const b = el("span", "badge");
    const v = el("span", "bv", item.badge.value);
    if (item.badge.red_from != null && +item.badge.value >= item.badge.red_from) v.classList.add("bad");
    b.append(el("span", "bl", item.badge.label), " ", v);  // подчёркнута только подпись
    h.append(el("span", "bgap"), b);
  }
  return h;
}

function bodyEl(item) {
  const b = el("div", "body");
  if (item.id === "quotes" && item.charts && item.lines && item.lines.length) {
    const q = quotesEl(item);
    b.append(q);
    b.rng = q.rng;
    if (!item.ok) b.append(warnEl(item));
    return b;
  }
  if (item.rows && item.rows.length) {  // платежи: имя и сумма в строку, реквизит под ними
    const g = el("div", "pays");
    for (const r of item.rows) {
      const v = el("span", "pv " + (r.v > 0 ? "up" : r.v < 0 ? "down" : ""),
        (r.v < 0 ? "−" : r.v > 0 ? "+" : "") + Math.round(Math.abs(r.v)).toLocaleString("ru-RU") + " ₽");
      g.append(el("span", "pn", r.name), v, noteEl(r));
    }
    b.append(g);
  } else if (item.table && item.table.rows && item.table.rows.length) {  // таблица из листа: название и числа
    const t = el("div", "tbl");
    t.style.gridTemplateColumns = "minmax(0, 1fr)" + " max-content".repeat(item.table.head.length - 1);
    item.table.head.forEach((h, i) => {
      const c = el("span", "th" + (i ? " tv" : " tt"));
      c.append(i ? h : head("h3", item));   // в первой ячейке шапки — название подкарточки
      t.append(c);
    });
    item.table.rows.forEach((r, n) => r.forEach((x, i) => {
      const c = el("span", (i ? "tv" : "tn") + (n ? "" : " r1"), x);
      const z = item.table.zones;
      if (z && i === z.col) { const k = zoneOf(z, x); if (k && !(k === "ok" && z.ok === false)) c.classList.add(k); }  // ok:false — выше порога без цвета
      if ((item.table.zero_cols || []).includes(i) && x !== "" && +x === 0) c.classList.add("bad");  // нули — красным
      if (!i) c.title = x;   // полное название при наведении
      t.append(c);
    }));
    b.append(t);
  } else if (item.cols && item.cols.length) {  // столбцы листа рядом: заголовок и значения под ним
    const g = el("div", "ocols");
    g.style.gridTemplateColumns = `repeat(${Math.min(item.cols.length, item.per_row || 99)}, minmax(0, 1fr))`;  // по per_row в ряд
    for (const c of item.cols) {
      const sub = el("div", "sub");
      sub.append(el("h3", "", c.title || "—"));
      const sb = el("div", "body");
      if (c.values.length) { const ul = el("ul"); c.values.forEach(v => ul.append(el("li", "", v))); sb.append(ul); }
      else sb.append(el("div", "none", "—"));
      sub.append(sb);
      g.append(sub);
    }
    b.append(g);
  } else if (LISTS.includes(item.id) && item.lines && item.lines.length) {
    const ul = el("ul", "items");
    for (const l of item.lines) ul.append(el("li", "", l));
    b.append(ul);
  } else {
    const pre = el("pre");
    fillPre(pre, item.lines && item.lines.length ? item.lines : ["Нет данных."]);
    b.append(pre);
  }
  if (!item.ok) b.append(warnEl(item));
  return b;
}

// Реквизит одной кнопкой: клик копирует готовую фразу для клиента
function copyBtn(label, value) {
  const b = el("button", "cp", label);
  b.type = "button"; if (typeof value === "string") b.title = "Скопировать: " + value;
  b.onclick = async () => {
    try { await navigator.clipboard.writeText(typeof value === "function" ? value() : value); b.classList.add("ok"); }
    catch (e) { b.classList.add("err"); }
    setTimeout(() => b.classList.remove("ok", "err"), 900);
  };
  return b;
}
function noteEl(r) {
  const box = el("span", "pd");
  const note = (r.note || "").replace(/\s+/g, " ").trim();
  if (note) box.append(copyBtn(note, "денежку можно кидать на карту по номеру " + note + ", " + r.name));
  return box;
}

// Торговая тема считается заброшенной, если не обновлялась дольше STALE_DAYS дней (дата «ДД.ММ» без года — последнее такое число)
const STALE_DAYS = 10;
function daysSince(dm) {
  const [d, m] = dm.split(".").map(Number);
  const now = new Date(TODAY.y, TODAY.m - 1, TODAY.d);
  let t = new Date(TODAY.y, m - 1, d);
  if (t > now) t = new Date(TODAY.y - 1, m - 1, d);
  return Math.round((now - t) / 864e5);
}

// Цвет числа по порогам: больше hi — зелёный (ok), от lo до hi — жёлтый (mid), меньше lo — красный (bad)
function zoneOf(z, x) {
  if (x === "" || isNaN(+x)) return "";
  return +x > z.hi ? "ok" : +x >= z.lo ? "mid" : "bad";
}
// Кнопки выгрузки под таблицей: копируют строки «название — число» (все или только нужного цвета)
function exportEl(t) {
  const box = el("div", "cpbox"), row = el("div", "cprow");
  if (t.export_label) { const l = el("div", "cplbl"); l.append(el("span", "", t.export_label)); box.append(l); }  // подпись над кнопками
  box.append(row);
  for (const e of t.export) {
    const b = copyBtn(e.label, () => e.zero
      ? t.rows.filter(r => r[e.col] !== "" && +r[e.col] === 0).map(r => r[0]).join("\n")   // только названия позиций с нулём
      : t.rows.filter(r => !e.zone || zoneOf(t.zones, r[e.col]) === e.zone).map(r => r[0] + " — " + r[e.col]).join("\n"));
    if (t.export_label) b.classList.add("z-" + (e.zero ? "bad" : e.zone || "all"));  // кнопка в цвет своих строк, «все» — белая
    row.append(b);
  }
  return box;
}

// Кнопки во всю ширину под заголовком блока: клик копирует заданный текст (buttons в config.json)
function buttonsEl(item) {
  const row = el("div", "cprow");
  for (const x of item.buttons) row.append(copyBtn(x.label, x.copy));
  return row;
}

// Topdeck — таблица: слева категории (подблоки), сверху участники, на пересечении кнопка со статусом
const TIPS = {
  auctions: { shown: "идут аукционы", stub: "аукционов нет", error: "данные не получены" },
  trades: { shown: "тема видна", hidden: "тема скрыта", stub: "пока нет", error: "статус не получен" },
  messages: { shown: "всё прочитано", hidden: "есть непрочитанные", error: "данные не получены" },
};
function matrixEl(c) {
  const box = el("div", "sub"), mx = el("div", "mx");
  const people = c.sections[0].items.map(it => it.label);
  mx.style.gridTemplateColumns = "min-content" + " minmax(0, 1fr)".repeat(people.length);  // подписи категорий переносятся по словам
  mx.append(el("span"));
  for (const n of people) mx.append(el("h3", "", n));
  for (const s of c.sections) {
    mx.append(el("span", "mk", s.title));
    (s.items || []).forEach(it => {
      const x = el(it.url ? "a" : "span", "sb " + it.state);
      const l = el("span", "l", it.date || it.info || "—");  // «26.10», «5 до 02.11 20:00»
      if (it.date && daysSince(it.date) > STALE_DAYS) l.classList.add("old");
      x.append(l);
      x.title = ((TIPS[s.id] || {})[it.state] || "") + (it.count ? ": " + it.count : "");
      if (it.bump) {  // справа звезда «Поднять»: красная — можно, синяя — ещё рано
        x.classList.add("split");
        const r = el("span", "r " + it.bump, "★");
        r.title = it.bump === "can" ? "тему можно поднять" : (it.bump_tip || "поднимать пока рано");
        x.append(r);
      }
      if (it.url) { x.href = it.url; x.target = "_blank"; x.rel = "noopener"; }
      mx.append(x);
    });
  }
  box.append(mx);
  for (const s of c.sections) if (!s.ok) box.append(warnEl({ error: s.title + ": " + s.error }));
  return box;
}

function subEl(s) {
  const sub = el("div", "sub");
  sub.dataset.id = s.id;
  if (!(s.table && s.table.rows && s.table.rows.length)) sub.append(head("h3", s));  // у таблиц заголовок встаёт в строку шапки
  if (s.sections) {  // вложенный блок: подблоки внутри подблока
    const inner = el("div", "subs");
    for (const x of s.sections) inner.append(subEl(x));
    sub.append(inner);
  } else {
    if (s.buttons && s.buttons.length) sub.append(buttonsEl(s));  // кнопки сразу под заголовком
    sub.append(bodyEl(s));
    if (s.table && s.table.export && s.table.rows && s.table.rows.length) sub.append(exportEl(s.table));
  }
  return sub;
}

function render(data) {
  const tz = TZ = data.timezone || "Europe/Moscow";
  setToday(tz);
  root.innerHTML = "";
  const col1 = el("div", "col1"), col2 = el("div", "col2"); root.append(col1, col2);
  for (const c of data.cards) {
    const card = el("section", "card");
    card.dataset.id = c.id;
    card.append(head("h2", c));
    if (c.id === "topdeck" && c.sections && c.sections.length && c.sections[0].items) {
      card.append(matrixEl(c));
    } else if (c.sections) {
      const subs = el("div", "subs");
      for (const s of c.sections) subs.append(subEl(s));
      card.append(subs);
    } else {
      const b = bodyEl(c);
      card.append(b);
      if (b.rng) card.querySelector("h2").append(b.rng);  // переключатель — справа в заголовке
    }
    (COL1.includes(c.id) ? col1 : COL2.includes(c.id) ? col2 : root).append(card);
  }
  stamp.textContent = "данные собраны " + fmt(data.updated, tz);
  showHits(data.cards);
}

// ---------- пароль: data.json зашифрован (см. collect.py), расшифровываем в браузере ----------
const KDF_SALT = "DashMtGMain", KEY_STORE = "dashmtg-key";
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const hex = b => [...b].map(x => x.toString(16).padStart(2, "0")).join("");
const unhex = h => new Uint8Array(h.match(/../g).map(x => parseInt(x, 16)));
const store = {   // хранилище браузера может быть недоступно — тогда просто спрашиваем пароль каждый раз
  get() { try { return localStorage.getItem(KEY_STORE) || sessionStorage.getItem(KEY_STORE); } catch (e) { return null; } },
  set(v, remember) { try { (remember ? localStorage : sessionStorage).setItem(KEY_STORE, v); } catch (e) {} },
  clear() { try { localStorage.removeItem(KEY_STORE); sessionStorage.removeItem(KEY_STORE); } catch (e) {} },
};

async function deriveKey(password, iter) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveBits"]);
  const bits = await crypto.subtle.deriveBits(
    { name: "PBKDF2", hash: "SHA-256", salt: new TextEncoder().encode(KDF_SALT), iterations: iter }, base, 512);
  return new Uint8Array(bits);
}
const hmacKey = raw => crypto.subtle.importKey("raw", raw, { name: "HMAC", hash: "SHA-256" }, false, ["sign"]);
async function decrypt(box, master) {
  const nonce = b64(box.nonce), ct = b64(box.ct), tag = b64(box.tag);
  const ek = await hmacKey(master.slice(0, 32)), mk = await hmacKey(master.slice(32));
  const signed = new Uint8Array(nonce.length + ct.length); signed.set(nonce); signed.set(ct, nonce.length);
  const want = new Uint8Array(await crypto.subtle.sign("HMAC", mk, signed));
  if (want.length !== tag.length || want.some((x, i) => x !== tag[i])) throw new Error("bad password");
  const blocks = [];
  for (let i = 0; i < Math.ceil(ct.length / 32); i++) {
    const m = new Uint8Array(20); m.set(nonce); new DataView(m.buffer).setUint32(16, i);
    blocks.push(crypto.subtle.sign("HMAC", ek, m));
  }
  const ks = (await Promise.all(blocks)).map(x => new Uint8Array(x));
  const pt = ct.map((x, i) => x ^ ks[i >> 5][i & 31]);
  return JSON.parse(new TextDecoder().decode(pt));
}

function loginEl(box, wrong) {
  root.innerHTML = "";
  stamp.textContent = "";
  const card = el("section", "card login");
  const h = el("h2"); h.textContent = "Вход"; card.append(h);
  const f = el("form");
  const inp = el("input"); inp.type = "password"; inp.placeholder = "пароль"; inp.autocomplete = "current-password";
  const lab = el("label", "rem"); const cb = el("input"); cb.type = "checkbox"; cb.checked = true;
  lab.append(cb, " запомнить на этом устройстве");
  const btn = el("button", "", "Открыть"); btn.type = "submit";
  const msg = el("div", "lmsg", wrong ? "Неверный пароль." : "");
  f.append(inp, lab, btn, msg);
  f.onsubmit = async ev => {
    ev.preventDefault();
    btn.disabled = true; msg.textContent = "проверяю…";
    try {
      const master = await deriveKey(inp.value, box.iter);
      const data = await decrypt(box, master);
      store.set(hex(master), cb.checked);
      render(data);
    } catch (e) { msg.textContent = "Неверный пароль."; btn.disabled = false; inp.select(); }
  };
  card.append(f);
  root.append(card);
  inp.focus();
}

// В шапке после даты — красным названия блоков, где встречается сегодняшняя дата
function showHits(cards) {
  const out = [];
  const walk = n => {
    if (n.sections) { n.sections.forEach(walk); return; }
    const hit = (n.lines || []).some(l => { DATE_RE.lastIndex = 0; let m; while ((m = DATE_RE.exec(l))) if (isToday(m)) return true; return false; })
      || (n.items || []).some(it => { const m = (it.info || "").match(/до (\d{2})\.(\d{2})/); return m && +m[1] === TODAY.d && +m[2] === TODAY.m; });  // аукцион кончается сегодня
    if (hit && !out.includes(n.title)) out.push(n.title);
  };
  cards.forEach(walk);
  document.getElementById("hits").textContent = out.join(" · ");
}

async function load() {
  stamp.textContent = "загрузка…";
  try {
    const r = await fetch("data.json?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const data = await r.json();
    if (!data.enc) { render(data); return; }
    const saved = store.get();
    if (!saved) { loginEl(data); return; }
    try { render(await decrypt(data, unhex(saved))); }
    catch (e) { store.clear(); loginEl(data, true); }   // пароль сменили — спрашиваем заново
  } catch (e) {
    root.textContent = "Не удалось загрузить data.json: " + e.message +
      " (страницу нужно открывать по ссылке GitHub Pages, а не файлом с диска)";
    stamp.textContent = "";
  }
}

reloadBtn.onclick = load;
setInterval(load, 10 * 60 * 1000);
load();
</script>
