name: Проба TopDeck (временно)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Проба
        env:
          TOPDECK_COOKIE: ${{ secrets.TOPDECK_COOKIE }}
          TOPDECK_COOKIE_SAT: ${{ secrets.TOPDECK_COOKIE_SAT }}
        run: |
          python3 - <<'PY'
          import os, re
          from urllib.request import Request, urlopen
          for name, topic, sec in (("Sol", 335343, "TOPDECK_COOKIE"), ("Sat", 355026, "TOPDECK_COOKIE_SAT")):
              req = Request(f"https://topdeck.ru/forums/topic/{topic}/",
                            headers={"User-Agent": "Mozilla/5.0 (dashboard-collector)", "Cookie": os.environ[sec]})
              with urlopen(req, timeout=60) as r:
                  page = r.read().decode("utf-8", "replace")
              page = re.sub(r'(?i)(csrf\w*|key|token|hash)=[0-9a-zA-Z]{8,}', r'\1=***', page)
              page = re.sub(r'(?i)(name="csrf\w*" value=")[^"]*', r'\1***', page)
              hits = [m.start() for m in re.finditer(r"(?i)подня", page)]
              print(f"::warning::{name}: bytes={len(page)} 'подня'={len(hits)}")
              for k in hits[:3]:
                  a = page.rfind("<", 0, max(0, k - 600))
                  print(f"::warning::{name}@{k}: " + re.sub(r"\s+", " ", page[max(a, k - 900):k + 400])[:2600])
          PY
