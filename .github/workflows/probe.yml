name: Проба TopDeck (временно)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Проба
        env:
          TOPDECK_COOKIE: ${{ secrets.TOPDECK_COOKIE }}
        run: |
          python3 - <<'PY'
          import os, re, html as H
          from urllib.request import Request, urlopen
          req = Request("https://topdeck.ru/apps/toptrade/member/96/aucs",
                        headers={"User-Agent": "Mozilla/5.0 (dashboard-collector)", "Cookie": os.environ["TOPDECK_COOKIE"]})
          with urlopen(req, timeout=60) as r:
              page = r.read().decode("utf-8", "replace")
          page = re.sub(r'(?i)(name="csrf_\w+" value=")[^"]*', r"\1***", page)
          page = re.sub(r"(?i)(csrf\w*|key|token)=[0-9a-f]{8,}", r"\1=***", page)
          body = page[page.find("<body"):]
          body = re.sub(r"(?is)<(script|style|svg)\b.*?</\1>", "", body)
          out = [f"bytes={len(page)}"]
          for pat in (r"<time[^>]*>", r"datetime=\"[^\"]+\"", r"data-[\w-]*(?:time|date|end)[\w-]*=\"[^\"]+\"", r"\d{1,2}:\d{2}"):
              f = re.findall(pat, body)
              out.append(f"{pat}: {len(f)} {f[:4]}")
          m = re.search(r"(?i)ставк", body)
          if m:
              a = max(0, m.start() - 3000)
              frag = re.sub(r"\s+", " ", body[a:m.end() + 1500])
              for i in range(0, len(frag), 2400):
                  out.append("frag: " + frag[i:i + 2400])
          for line in out:
              print("::warning::" + line)
          PY
