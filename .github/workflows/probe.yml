name: Проба TopDeck (временно)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Проба
        env:
          TOPDECK_COOKIE: ${{ secrets.TOPDECK_COOKIE }}
        run: |
          python3 - <<'PY'
          import os, re
          from urllib.request import Request, urlopen
          ck = os.environ.get("TOPDECK_COOKIE", "")
          out = [f"cookie: {'есть' if ck else 'НЕТ'}"]
          for name, hdr in (("anon", {}), ("auth", {"Cookie": ck})):
              try:
                  req = Request("https://topdeck.ru/apps/toptrade/member/96",
                                headers={"User-Agent": "Mozilla/5.0 (dashboard-collector)", **hdr})
                  with urlopen(req, timeout=60) as r:
                      html = r.read().decode("utf-8", "replace"); code = r.status
              except Exception as e:
                  out.append(f"{name}: ошибка {e}"); continue
              html_r = re.sub(r"(csrfKey|csrf|key|token)=[0-9a-f]+", r"\1=***", html)
              logged = bool(re.search(r"(?i)sign out|выйти|signout|logout", html))
              out.append(f"{name}: HTTP {code}, {len(html)} байт, вход={'да' if logged else 'нет'}, "
                         f"Скрыть={html.count('Скрыть')}, Показать={html.count('Показать')}")
              for w in ("Скрыть", "Показать"):
                  for m in list(re.finditer(w, html_r))[:3]:
                      a = html_r.rfind("<", 0, max(0, m.start() - 250))
                      frag = re.sub(r"\s+", " ", html_r[max(a, m.start() - 400):m.end() + 120])
                      out.append(f"{name} [{w}]: {frag}")
          for line in out:
              print("::warning::" + line.replace("\n", " ")[:3000])
          PY
