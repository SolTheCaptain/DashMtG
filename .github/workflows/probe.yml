name: Проба EchoMTG
on:
  push:
    branches: [probe-echo]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python probe/echo_probe.py
        env:
          ECHOMTG_TOKEN: ${{ secrets.ECHOMTG_TOKEN }}
      - run: |
          git config user.name probe-bot
          git config user.email probe@users.noreply.github.com
          git add probe/result.json
          git commit -m "Результат пробы [skip ci]" && git push
